services:
  operadoresago-web:
    build: .
    container_name: operadoresago-web
    ports:
      - "3005:3000"
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://web.operadoresago.com}
      SMTP_HOST: ${SMTP_HOST:-mail.korreoweb.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-AGO TECH}
      MAIL_FROM: ${MAIL_FROM:-contacto@operadoresago.com}
      CONTACT_TO: ${CONTACT_TO:-contacto@operadoresago.com}
      IMPACT_METRICS_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
